<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>

  <!-- outer border -->
  <rect x="5" y="5" width="1090" height="550" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- divider between the two panels -->
  <line x1="5" y1="277" x2="1095" y2="277" stroke="#000000" stroke-width="2"/>

  <!-- ============ TOP PANEL: TODAY ============ -->
  <text x="30" y="50" font-size="30" font-weight="bold">Today</text>

  <!-- Task box -->
  <rect x="520" y="15" width="90" height="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="565" y="37" font-size="16" font-weight="bold" text-anchor="middle">Task</text>

  <!-- boxes -->
  <rect x="30" y="90" width="120" height="100" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="90" y="145" font-size="15" text-anchor="middle">Training</text>
  <text x="90" y="163" font-size="15" text-anchor="middle">Data</text>

  <rect x="175" y="90" width="150" height="100" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="250" y="128" font-size="15" text-anchor="middle">Machine</text>
  <text x="250" y="146" font-size="15" text-anchor="middle">Learning</text>
  <text x="250" y="164" font-size="15" text-anchor="middle">Process</text>

  <rect x="350" y="90" width="130" height="100" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="415" y="137" font-size="15" text-anchor="middle">Learned</text>
  <text x="415" y="155" font-size="15" text-anchor="middle">Function</text>

  <!-- arrows between boxes -->
  <line x1="150" y1="140" x2="173" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="140" x2="348" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision / recommendation arrow to user -->
  <line x1="480" y1="140" x2="768" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="112" font-size="13" font-weight="bold" text-anchor="middle">Decision or</text>
  <text x="630" y="128" font-size="13" font-weight="bold" text-anchor="middle">Recommendation</text>

  <!-- Task feeding down into the decision arrow -->
  <path d="M565,47 L565,138" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User icon (frustrated, top row) -->
  <circle cx="800" cy="120" r="17" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M786,133 Q800,124 814,133" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M783,137 Q800,152 817,137 L820,180 L780,180 Z" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="822" y="102" font-size="22" font-weight="bold" text-anchor="middle">?</text>
  <text x="800" y="205" font-size="16" font-weight="bold" text-anchor="middle">User</text>

  <!-- bullet list, top row -->
  <g font-size="13">
    <text x="845" y="70">• Why did you do that?</text>
    <text x="845" y="92">• Why not something else?</text>
    <text x="845" y="114">• When do you succeed?</text>
    <text x="845" y="136">• When do you fail?</text>
    <text x="845" y="158">• When can I trust you?</text>
    <text x="845" y="180">• How do I correct an error?</text>
  </g>

  <!-- ============ BOTTOM PANEL: XAI ============ -->
  <text x="30" y="330" font-size="30" font-weight="bold">XAI</text>

  <!-- Task box -->
  <rect x="520" y="295" width="90" height="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="565" y="317" font-size="16" font-weight="bold" text-anchor="middle">Task</text>

  <!-- boxes -->
  <rect x="30" y="375" width="120" height="100" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="90" y="430" font-size="15" text-anchor="middle">Training</text>
  <text x="90" y="448" font-size="15" text-anchor="middle">Data</text>

  <rect x="175" y="375" width="150" height="100" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="250" y="404" font-size="14" text-anchor="middle">New</text>
  <text x="250" y="422" font-size="14" text-anchor="middle">Machine Learning</text>
  <text x="250" y="440" font-size="14" text-anchor="middle">Process</text>

  <rect x="350" y="375" width="120" height="100" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="410" y="422" font-size="14" text-anchor="middle">Explainable</text>
  <text x="410" y="440" font-size="14" text-anchor="middle">Model</text>

  <rect x="490" y="375" width="150" height="100" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="565" y="422" font-size="14" text-anchor="middle">Explanation</text>
  <text x="565" y="440" font-size="14" text-anchor="middle">Interface</text>

  <!-- arrows between boxes -->
  <line x1="150" y1="425" x2="173" y2="425" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="425" x2="348" y2="425" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="425" x2="488" y2="425" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- arrow to user -->
  <line x1="640" y1="425" x2="768" y2="425" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Task feeding down into the model boundary -->
  <path d="M565,327 L565,373" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User icon (satisfied, bottom row, with laptop) -->
  <circle cx="800" cy="400" r="17" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M791,404 Q800,412 809,404" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M783,417 Q800,432 817,417 L820,455 L780,455 Z" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- laptop -->
  <path d="M778,455 L790,436 L810,436 L822,455 Z" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="768" y="455" width="64" height="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="800" y="490" font-size="16" font-weight="bold" text-anchor="middle">User</text>

  <!-- bullet list, bottom row -->
  <g font-size="13">
    <text x="845" y="355">• I understand why</text>
    <text x="845" y="377">• I understand why not</text>
    <text x="845" y="399">• I know when you succeed</text>
    <text x="845" y="421">• I know when you fail</text>
    <text x="845" y="443">• I know when to trust you</text>
    <text x="845" y="465">• I know why you erred</text>
  </g>
</svg>
